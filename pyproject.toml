[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "chrome_client"
version = "0.1.4"
description = "Python bindings for Cronet-Cloak - Authentic Chrome TLS/HTTP2 fingerprints with async support"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "dataclasses>=0.8; python_version < '3.7'",
    "typing_extensions>=4.1; python_version < '3.8'",
]
license = { text = "MIT" }
keywords = ["cronet", "chrome", "tls", "fingerprint", "http2", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/komAAmok/chrome_client"

[tool.maturin]
python-source = "python"
module-name = "chrome_client.cronet_cloak"
strip = true

# Include type stubs and native libraries in the wheel package
include = [
    { path = "python/chrome_client/*.pyi", format = "wheel" },
    { path = "python/chrome_client/py.typed", format = "wheel" },
    { path = "python/chrome_client/*.dll", format = "wheel" },
    { path = "python/chrome_client/*.so", format = "wheel" },
    { path = "python/chrome_client/*.dylib", format = "wheel" },
    { path = "python/chrome_client/tls_profiles.json", format = "wheel" }
]

# Exclude unnecessary files from source
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.backup*",
    "cronet-bin/**"
]
