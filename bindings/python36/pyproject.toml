[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chrome-client"
description = "Chromium Core HTTP/WebSocket client"
# Must render the same project introduction as bindings/python: both wheels
# publish to the same PyPI release, so a differing readme makes the project page
# depend on upload order. maturin refuses a readme outside this directory because
# python36 is its own Cargo workspace, so the root README is mirrored here and
# `tools/audit-readme.sh` fails the build if the copy drifts.
readme = "README.md"
# cp36-abi3 wheel: installs on any CPython 3.6 through 3.15. The old bound
# (<3.7) understated this and, intersected with the main wheel's bound on the
# PyPI page, made the project show "Requires Python <3.7, >=3.6". pip's tag
# matching prefers the cp39-abi3 wheel from bindings/python on 3.9 and newer,
# so this wheel serves 3.6-3.8.
requires-python = ">=3.6,<3.16"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/komAAmok/chrome_client"
Repository = "https://github.com/komAAmok/chrome_client"

[tool.maturin]
manifest-path = "Cargo.toml"
# python-source points at bindings/python, which is where the whole facade lives:
# this wheel and the cp39 one ship the same Python, and only the native module
# differs. The `include` globs below match nothing next to this file and are then
# retried relative to `python-source` (maturin config docs: "Glob patterns are
# resolved relative to the directory containing pyproject.toml. When using
# python-source, patterns are also tried relative to the python-source directory if
# they don't match relative to pyproject.toml"), which is where they resolve:
# 20 .py, 47 .pyi and py.typed under bindings/python/chrome_client.
python-source = "../python"
include = [
    { path = "chrome_client/**/*.py", format = "wheel" },
    { path = "chrome_client/**/*.pyi", format = "wheel" },
    { path = "chrome_client/py.typed", format = "wheel" },
]
module-name = "chrome_client.chrome_client_native36"
