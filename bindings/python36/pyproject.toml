[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chrome-client"
version = "0.2.2"
description = "Chromium Core HTTP/WebSocket client"
# Must render the same project introduction as bindings/python: both wheels
# publish to the same PyPI release, so a differing readme makes the project page
# depend on upload order. maturin refuses a readme outside this directory because
# python36 is its own Cargo workspace, so the root README is mirrored here and
# `tools/audit-readme.sh` fails the build if the copy drifts.
readme = "README.md"
# cp36-abi3 wheel: installs on any CPython 3.6 through 3.13. The old bound
# (<3.7) understated this and, intersected with the main wheel's bound on the
# PyPI page, made the project show "Requires Python <3.7, >=3.6".
requires-python = ">=3.6,<3.14"

[project.urls]
Homepage = "https://github.com/komAAmok/chrome_client"
Repository = "https://github.com/komAAmok/chrome_client"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "../python"
module-name = "chrome_client.chrome_client_native36"
