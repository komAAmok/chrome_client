[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chrome-client"
version = "0.2.0"
description = "Chromium Core HTTP/WebSocket client"
requires-python = ">=3.7"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "."
module-name = "chrome_client.chrome_client_native"
