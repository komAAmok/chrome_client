[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chrome-client"
version = "0.3.0"
description = "Chromium Core HTTP/WebSocket client"
readme = "../../README.md"
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/komAAmok/chrome_client"
Repository = "https://github.com/komAAmok/chrome_client"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "."
module-name = "chrome_client.chrome_client_native"
