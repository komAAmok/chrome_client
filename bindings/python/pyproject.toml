[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chrome-client"
description = "Chromium Core HTTP/WebSocket client"
readme = "../../README.md"
# This wheel is cp39-abi3 (pyo3 0.30.1, whose minimum supported Python is 3.9),
# the python36 wheel is cp36-abi3 (pyo3 0.15.1). Both abi3 wheels declare the
# full supported range so the PyPI project page shows 3.6-3.15; pip's tag
# matching still refuses this cp39 wheel on Python 3.6-3.8 and picks the cp36
# wheel there.
requires-python = ">=3.6,<3.16"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/komAAmok/chrome_client"
Repository = "https://github.com/komAAmok/chrome_client"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "."
module-name = "chrome_client.chrome_client_native"
