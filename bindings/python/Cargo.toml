[package]
name = "chrome-client-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "chrome_client_native"
crate-type = ["cdylib"]

[lints]
# Opt in to [workspace.lints] in the root Cargo.toml. Without this line the
# workspace deny for unsafe_op_in_unsafe_fn is silently inert, because cargo
# only applies workspace lints to members that ask for them.
workspace = true

[dependencies]
minicronet = { path = "../../crates/minicronet" }
pyo3 = { version = "=0.28.3", features = ["extension-module", "abi3-py37", "generate-import-lib"] }