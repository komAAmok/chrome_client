name: Rust structure CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit-abi.sh
      - run: tools/audit-readme.sh
      # Pure static audit of the committed Core artifacts: manifest fields,
      # SHA-256, size, the twenty ABI exports per platform and the reverse
      # assertion that no icudtl.dat travels with a Windows build. Needs no
      # Chromium checkout, so it belongs in the structure job.
      - run: tools/audit-core-binaries.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `cargo test --all-targets` executes the example binaries, which link the
      # Core; its DT_NEEDED list includes NSS. The runner image happens to ship
      # it, but an explicit install keeps the job from depending on that.
      - run: sudo apt-get update && sudo apt-get install -y libnss3
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --manifest-path bindings/python36/Cargo.toml --locked

  python-regression:
    # The Linux x86_64 Core is committed, so both regression suites can run
    # here: test_stability.py covers streaming, backpressure, cancellation, IDN
    # and lifetimes, and test_compat.py covers the requests/curl-cffi surface,
    # cookie sessions, proxy routing, the async leak bound and concurrency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      # The Core links NSS for the system trust store; see
      # core/binaries/linux-x86_64/manifest.json runtime_dependencies.
      - run: sudo apt-get update && sudo apt-get install -y libnss3
      # test_compat.CertificateErrorTests generates its own CA and three
      # defective leaf certificates. Without this the whole class skips, and the
      # check that a rejected certificate reports ERR_CERT_* rather than
      # ERR_ABORTED would silently not run.
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify the Core loads before running the suite
        run: |
          set -Eeuo pipefail
          core=$PWD/core/binaries/linux-x86_64
          ldd "$core/libminicronet.so" | grep -q 'not found' \
            && { ldd "$core/libminicronet.so"; exit 1; }
          echo "all DT_NEEDED entries resolve"
      - name: Build the native extension against the committed Core
        run: cargo build --release -p chrome-client-python
        env:
          MINICRONET_CORE_DIR: ${{ github.workspace }}/core/binaries/linux-x86_64
      - name: Run the Python regression suites
        run: python -m unittest discover -s bindings/python/tests -p "test_*.py" -v
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/python:${{ github.workspace }}/target/release
          MINICRONET_CORE_DIR: ${{ github.workspace }}/core/binaries/linux-x86_64
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/binaries/linux-x86_64
