name: Rust structure CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit-abi.sh
      # audit-abi.sh compares symbol names. This compiles the header and
      # compares every field's real offsetof/sizeof against the Rust
      # #[repr(C)] declaration, so adding a field to the header alone fails
      # here instead of silently shifting what every caller reads.
      - run: python3 tools/audit-abi-layout.py
      - run: tools/audit-readme.sh
      - run: tools/audit-pypi-metadata.sh
      # The .pyi stubs are hand-written, so this asserts every runtime
      # signature, default, docstring and facade re-export still matches
      # them. Pure stdlib, no Core needed.
      - run: python3 tools/audit-python-stubs.py
      # Every curl_cffi extra_fp field must have a recorded verdict.
      # curl_cffi simulates Chrome, Firefox and Safari, so several of its
      # knobs (delegated credentials, record_size_limit, split_cookies) have
      # no counterpart here; accepting them silently would tell a caller
      # they changed a degree of freedom that does not exist. A new knob
      # without a verdict fails this gate.
      - run: python3 tools/audit-extra-fp.py
      # Pure static audit of the committed Core artifacts: manifest fields,
      # SHA-256, size, the twenty ABI exports per platform, the presence of the
      # ICU ISO-8859-1 converter table that HTTP Basic/Digest realms need, and
      # the reverse assertion that no icudtl.dat travels with a Windows build.
      # Needs no Chromium checkout, so it belongs in the structure job.
      - run: tools/audit-core-binaries.sh
      # Every Core build input must be owned by this repository rather than by
      # whichever Chromium checkout happens to sit next to it. Four
      # profile-verification probes once lived only in the developer's tree, so
      # tools/sync-core.sh passed there and died on every fresh clone. Pure
      # static: resolves core/source/BUILD.gn's names and asks Git whether the
      # files sync-core.sh installs or applies are tracked, so it needs no
      # Chromium checkout and belongs in the structure job.
      - run: tools/audit-core-inputs.sh
      # Each audit-core-*.sh derives its size ceiling as "largest artifact
      # x 1.02, rounded up to 10,000". Adding profiles grows the artifacts, and a
      # ceiling that was correct last release is then below what its own rule
      # demands -- Windows sat at 9,600,000 against a required 9,610,000 and
      # nothing noticed, because the only thing checking the ceiling was the
      # ceiling. This compares the rule against the committed artifacts.
      - run: python3 tools/audit-core-size-ceilings.py
      # Every artifact must embed the profile payloads from the generated
      # header byte for byte. A build from a stale table has a consistent
      # manifest, so the SHA-256 and size checks cannot see it; and seven of
      # the eight targets cannot be executed on any build host, so nothing
      # else compares their payload bytes.
      - run: python3 tools/audit-core-payloads.py
      # profiles/ is the entire basis for the per-release tables, and every
      # entry records the sha256 of the upstream file it was audited against.
      # Nothing re-checked those digests, so a stale record and a correct one
      # looked identical: a profile could keep claiming "audited from tag X"
      # after X's real file changed. This re-downloads each recorded file from
      # the tag/revision named in the profile and compares the digest. It needs
      # no Chromium checkout, only network access to googlesource, which the
      # runner has. Bodies are cached in ~/.cache between runs but CI starts
      # cold, so expect this step to download the full evidence set.
      # The four per-release wire gates. Each pins a behaviour a profile-table
      # edit can silently break, and each reads either the generated header the
      # Core compiles (so a stale JSON input cannot make it pass) or the recorded
      # alignment evidence (so the header alone cannot vouch for itself). Pure
      # stdlib: no Chromium checkout and no network.
      - run: python3 tools/audit-padding-rule.py
      - run: python3 tools/audit-tls-version-range.py
      - run: python3 tools/audit-h1-alps-absence.py
      - run: python3 tools/audit-h3-profile-support.py
      # The three-level gate from AGENTS.md section 9, levels 1 and 2:
      # level 1 re-fetches the release's own source at its latest tag and
      # compares every recorded sha256, level 2 asserts six captured
      # connections per protocol with stable fields equal and stochastic
      # fields distinct. Level 3 (the built artifact reproducing the
      # captures) needs a live fingerprint endpoint, so it runs where the
      # Core can actually connect.
      - run: python3 tools/audit-profile-addition.py --levels 1,2 --profile chrome_157
      - run: python3 tools/audit-profile-evidence.py --jobs 4
      # The ERR_* names in exceptions.py tell a caller what a proxy or TLS
      # failure actually was. They had drifted badly (eight codes carried a
      # different error's name and the codes a proxy failure produces were
      # missing), so this needs a Chromium checkout and therefore cannot run
      # here. There is no Chromium-tree job in this workflow, so today it only
      # runs on a developer machine that has CHROMIUM_SRC -- see
      # docs/NEXT_STEPS.md, "待办：net error 名称审计没有 CI 入口". The
      # checkout-free half lives in test_compat.NetErrorTableShapeTests, which
      # the python-regression job does run.
      # The manifests are the provenance record the loader reads, so a manifest
      # that pins a different Chromium revision than CHROMIUM_REVISION would
      # describe a Core this repository never built.
      - name: Core manifest revision matches CHROMIUM_REVISION
        run: |
          set -Eeuo pipefail
          want=$(tr -d '[:space:]' < CHROMIUM_REVISION)
          for m in core/binaries/*/manifest.json; do
            got=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['chromium_revision'])" "$m")
            [ "$got" = "$want" ] || { echo "$m: $got != $want"; exit 1; }
          done
          echo "all manifests pin $want"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `cargo test --all-targets` executes the example binaries, which link the
      # Core; its DT_NEEDED list includes NSS. The runner image happens to ship
      # it, but an explicit install keeps the job from depending on that.
      - run: sudo apt-get update && sudo apt-get install -y libnss3
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --manifest-path bindings/python36/Cargo.toml --locked

  python-regression:
    # The Linux x86_64 Core is committed, so both regression suites can run
    # here: test_stability.py covers streaming, backpressure, cancellation, IDN
    # and lifetimes, and test_compat.py covers the requests/curl-cffi surface,
    # cookie sessions, proxy routing, the async leak bound and concurrency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      # The Core links NSS for the system trust store; see
      # core/binaries/linux-x86_64/manifest.json runtime_dependencies.
      - run: sudo apt-get update && sudo apt-get install -y libnss3
      # test_compat.CertificateErrorTests generates its own CA and three
      # defective leaf certificates. Without this the whole class skips, and the
      # check that a rejected certificate reports ERR_CERT_* rather than
      # ERR_ABORTED would silently not run.
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify the Core loads before running the suite
        run: |
          set -Eeuo pipefail
          core=$PWD/core/binaries/linux-x86_64
          ldd "$core/libminicronet.so" | grep -q 'not found' \
            && { ldd "$core/libminicronet.so"; exit 1; }
          echo "all DT_NEEDED entries resolve"
      - name: Build the native extension against the committed Core
        run: cargo build --release -p chrome-client-python
        env:
          MINICRONET_CORE_DIR: ${{ github.workspace }}/core/binaries/linux-x86_64
      # The suites exercise the extension, but only after it has loaded; this
      # step fails first and with a readable message when the Core, the
      # extension or the loader path is broken.
      - name: Import the extension and issue one request
        run: python -c "import chrome_client; r = chrome_client.get('https://example.com', timeout=30); assert r.status_code == 200, r.status_code; print('ok', chrome_client.core_version(), r.status_code)"
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/python:${{ github.workspace }}/target/release
          MINICRONET_CORE_DIR: ${{ github.workspace }}/core/binaries/linux-x86_64
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/binaries/linux-x86_64
      - name: Run the Python regression suites
        run: python -m unittest discover -s bindings/python/tests -p "test_*.py" -v
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/python:${{ github.workspace }}/target/release
          MINICRONET_CORE_DIR: ${{ github.workspace }}/core/binaries/linux-x86_64
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/binaries/linux-x86_64
      # The stubs are hand-written, so hold them to the runtime and to what a
      # caller actually sees. --warn-unused-ignores is what makes the two
      # deliberate mistakes in the fixture an assertion: if impersonate="chrome_200"
      # or an unknown keyword ever stops being an error, the ignore goes unused
      # and this step fails.
      #
      # Both checks live in tools/audit-python-typing.py so the local gate list
      # and CI run the same command. They did not, and a missing import in a
      # stub reached main: mypy only ran in CI, so it was the remote that found
      # it rather than the person who wrote it.
      - run: python -m pip install --disable-pip-version-check 'mypy>=1.11,<2' typing_extensions
      - name: Type-check the stubs and a consumer
        run: python3 tools/audit-python-typing.py
