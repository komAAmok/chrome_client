name: Build Python wheels

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the resulting wheels to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  # Keep all architecture jobs alive; canceling a queued macOS job on every
  # push made the Intel pair appear to never build.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MINICRONET_REQUIRE_NATIVE: "1"

jobs:
  linux:
    name: Linux ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            core-target: linux-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.10"
          - target: x86_64-unknown-linux-gnu
            core-target: linux-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            # maturin 0.14.17 requires Python >=3.7 to run, and manylinux2014 no
            # longer ships a cp37 interpreter; the abi3-py36 feature still emits
            # a cp36-abi3 wheel when built with CPython 3.9.
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.7"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
          - target: i686-unknown-linux-gnu
            core-target: linux-x86
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.10"
          - target: i686-unknown-linux-gnu
            core-target: linux-x86
            binding: python36
            manifest: bindings/python36/Cargo.toml
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.7"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
          - target: aarch64-unknown-linux-gnu
            core-target: linux-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.10"
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            core-target: linux-arm64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            interpreter: /opt/python/cp39-cp39/bin/python3.9
            python-version: "3.7"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Core artifact
        shell: bash
        run: |
          test -f "core/binaries/${{ matrix.core-target }}/libminicronet.so"
          test -f "core/binaries/${{ matrix.core-target }}/manifest.json"
          python3 - "${{ matrix.core-target }}" <<'PY'
          import hashlib, json, pathlib, sys
          target = sys.argv[1]
          root = pathlib.Path("core/binaries") / target
          manifest = json.loads((root / "manifest.json").read_text())
          path = root / manifest["library"]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == manifest["sha256"], (target, actual)
          assert path.stat().st_size == manifest["size_bytes"], target
          print("Core artifact verified:", target)
          PY

      - name: Set up QEMU for non-native manylinux targets
        if: matrix.target == 'i686-unknown-linux-gnu' || (matrix.target == 'aarch64-unknown-linux-gnu' && matrix.runner != 'ubuntu-24.04-arm')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,386

      - name: Build manylinux2014 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          docker-options: >-
            -e MINICRONET_REQUIRE_NATIVE=1
            -e RUSTFLAGS=${{ matrix.rustflags || '' }}
            -e LD_LIBRARY_PATH=${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib:/usr/lib/aarch64-linux-gnu
            -e AUDITWHEEL_LD_LIBRARY_PATH=${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib:/usr/lib/aarch64-linux-gnu
          before-script-linux: >-
            if command -v yum >/dev/null; then yum install -y nss nspr nss-util nss-libs || yum install -y nss nspr nss-util || yum install -y nss nspr || true; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y libnss3 libnspr4 || true; fi; ldconfig || true
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --interpreter ${{ matrix.interpreter }}
            --out dist

      - name: Inspect wheel
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check auditwheel
          auditwheel show dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            core-target: windows-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x64
          - target: x86_64-pc-windows-msvc
            core-target: windows-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.6"
            python-architecture: x64
            maturin-version: "0.14.17"
          - target: i686-pc-windows-msvc
            core-target: windows-x86
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x86
          - target: i686-pc-windows-msvc
            core-target: windows-x86
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.6"
            python-architecture: x86
            maturin-version: "0.14.17"
          - target: aarch64-pc-windows-msvc
            core-target: windows-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}

      - name: Install Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Stage Windows Core runtime
        shell: pwsh
        run: .\tools\stage-windows-wheel.ps1 -Target ${{ matrix.core-target }} -Binding ${{ matrix.binding }}

      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --target ${{ matrix.target }}
            --out dist

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -c "import zipfile; z=zipfile.ZipFile(r'$($wheel.FullName)'); n=set(z.namelist()); assert any(x.endswith('/minicronet.dll') for x in n); print('Windows runtime DLL present')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            core-target: macos-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            runner: macos-15
          - target: aarch64-apple-darwin
            core-target: macos-arm64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.10"
            runner: macos-15
            maturin-version: "0.14.17"
          - target: x86_64-apple-darwin
            core-target: macos-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            runner: macos-15-intel
          - target: x86_64-apple-darwin
            core-target: macos-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.10"
            runner: macos-15-intel
            maturin-version: "0.14.17"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify Core artifact
        run: |
          test -f "core/binaries/${{ matrix.core-target }}/libminicronet.dylib"
          python3 - "${{ matrix.core-target }}" <<'PY'
          import hashlib, json, pathlib, sys
          target = sys.argv[1]
          root = pathlib.Path("core/binaries") / target
          manifest = json.loads((root / "manifest.json").read_text())
          path = root / manifest["library"]
          assert hashlib.sha256(path.read_bytes()).hexdigest() == manifest["sha256"]
          assert path.stat().st_size == manifest["size_bytes"]
          print("Core artifact verified:", target)
          PY

      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --target ${{ matrix.target }}
            --out dist

      - name: Bundle macOS Core dylib
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check delocate
          mkdir repaired
          DYLD_LIBRARY_PATH="$PWD/core/binaries/${{ matrix.core-target }}" \
            delocate-wheel -w repaired dist/*.whl
          rm dist/*.whl
          mv repaired/*.whl dist/
          # maturin tags the wheel from its own deployment target (10.12 for
          # x86_64, 11.0 for arm64) but the Core dylib inside was built with the
          # upstream mac_deployment_target of 13.0, and delocate only rewrites
          # install names. Left alone, the wheel installs on macOS 10.12-12 and
          # then fails at import, because dlopen refuses a dylib newer than the
          # running system. Raise the tag to what the binary actually requires.
          python3 tools/macos-wheel-floor.py dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  # LESSONS 37 ("声明支持的版本，必须由「最老的那一版」来验证"): every other job
  # here proves the wheel was *built* and that its metadata *claims* 3.9+. None of
  # them installs it on 3.9 and issues a request. That gap is how a wheel can
  # carry a cp39-abi3 tag, be marked ✓ in the README, and still be unimportable
  # on 3.9 -- so this job runs the declared floor for real.
  python39-smoke:
    name: Python 3.9 smoke (modern wheel floor)
    # Pinned, not ubuntu-latest. The manifest actions/setup-python reads
    # (actions/python-versions) publishes prebuilt 3.9 only for 22.04 and 24.04,
    # while ubuntu-latest moved to 26.04, so the job died in its very first step
    # with "The version '3.9' with architecture 'x64' was not found for
    # Ubuntu 26.04". Pinning keeps the floor the job exists to prove, instead of
    # dropping it to whatever the image happens to ship.
    runs-on: ubuntu-24.04
    needs: [linux]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # Core links the system trust store, so libnss3 has to exist before the
      # request below can complete a handshake.
      - name: Install Core runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4
      # The linux job uploads 'wheel-linux-${{ matrix.core-target }}-${{ matrix.binding }}',
      # and matrix.core-target already reads 'linux-x86_64', so the artifact it
      # produces is 'wheel-linux-linux-x86_64-python' -- the doubled prefix is
      # correct and this name must match it character for character.
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-linux-x86_64-python
          path: dist
      - name: Install the modern wheel on its own floor version
        run: python3 -m pip install --disable-pip-version-check dist/*.whl
      # chrome_client._python_impl._native is not _native.py: the package does
      # 'from ._native import native as _native', which rebinds that attribute to
      # the extension module itself, and that object has no MODULE_NAME. Import
      # the module by name to read the facade's own constant.
      - name: Load the native module and issue one real request
        run: |
          python -c "import importlib, chrome_client; m = importlib.import_module('chrome_client._python_impl._native'); assert m.MODULE_NAME == 'chrome_client_native', m.MODULE_NAME; r = chrome_client.get('https://example.com', timeout=30); assert r.status_code == 200; print('ok', chrome_client.__version__, r.status_code)"

  metadata:
    name: Verify PyPI metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit-readme.sh
      # Requires-Python, version and README consistency are gated before any
      # wheel is uploaded: PyPI renders the intersection of all files' bounds,
      # so one wheel with a narrower bound mislabels the whole release.
      - run: tools/audit-pypi-metadata.sh

  publish:
    name: Publish wheels
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_pypi
    # python39-smoke belongs in needs: a wheel that cannot be imported on 3.9
    # must not reach PyPI, and that job is the only one that proves it can.
    needs: [linux, windows, macos, metadata, python39-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
