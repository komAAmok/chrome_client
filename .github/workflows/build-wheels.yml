name: Build Python wheels

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the resulting wheels to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  # Keep all architecture jobs alive; canceling a queued macOS job on every
  # push made the Intel pair appear to never build.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MINICRONET_REQUIRE_NATIVE: "1"

jobs:
  linux:
    name: Linux ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            core-target: linux-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.10"
          - target: x86_64-unknown-linux-gnu
            core-target: linux-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            # maturin requires Python >=3.7 to run; the abi3-py36 feature still
            # produces a cp36-abi3 wheel when built with CPython 3.7.
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.7"
            maturin-version: "0.14.17"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
          - target: i686-unknown-linux-gnu
            core-target: linux-x86
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.10"
          - target: i686-unknown-linux-gnu
            core-target: linux-x86
            binding: python36
            manifest: bindings/python36/Cargo.toml
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.7"
            maturin-version: "0.14.17"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
          - target: aarch64-unknown-linux-gnu
            core-target: linux-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.10"
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            core-target: linux-arm64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            interpreter: /opt/python/cp37-cp37m/bin/python3.7
            python-version: "3.7"
            maturin-version: "0.14.17"
            rustflags: '--cfg=py_sys_config="WITH_THREAD"'
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Core artifact
        shell: bash
        run: |
          test -f "core/binaries/${{ matrix.core-target }}/libminicronet.so"
          test -f "core/binaries/${{ matrix.core-target }}/manifest.json"
          python3 - "${{ matrix.core-target }}" <<'PY'
          import hashlib, json, pathlib, sys
          target = sys.argv[1]
          root = pathlib.Path("core/binaries") / target
          manifest = json.loads((root / "manifest.json").read_text())
          path = root / manifest["library"]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == manifest["sha256"], (target, actual)
          assert path.stat().st_size == manifest["size_bytes"], target
          print("Core artifact verified:", target)
          PY

      - name: Set up QEMU for non-native manylinux targets
        if: matrix.target == 'i686-unknown-linux-gnu' || (matrix.target == 'aarch64-unknown-linux-gnu' && matrix.runner != 'ubuntu-24.04-arm')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,386

      - name: Build manylinux2014 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          docker-options: >-
            -e MINICRONET_REQUIRE_NATIVE=1
            -e RUSTFLAGS=${{ matrix.rustflags || '' }}
            -e LD_LIBRARY_PATH=${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib:/usr/lib/aarch64-linux-gnu
            -e AUDITWHEEL_LD_LIBRARY_PATH=${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib:/usr/lib/aarch64-linux-gnu
          before-script-linux: >-
            if command -v yum >/dev/null; then yum install -y nss nspr nss-util nss-libs || yum install -y nss nspr nss-util || yum install -y nss nspr || true; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y libnss3 libnspr4 || true; fi; ldconfig || true
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --interpreter ${{ matrix.interpreter }}
            --out dist

      - name: Inspect wheel
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check auditwheel
          auditwheel show dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            core-target: windows-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x64
          - target: x86_64-pc-windows-msvc
            core-target: windows-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.6"
            python-architecture: x64
            maturin-version: "0.14.17"
          - target: i686-pc-windows-msvc
            core-target: windows-x86
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x86
          - target: i686-pc-windows-msvc
            core-target: windows-x86
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.6"
            python-architecture: x86
            maturin-version: "0.14.17"
          - target: aarch64-pc-windows-msvc
            core-target: windows-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            python-architecture: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}

      - name: Install Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Stage Windows Core runtime
        shell: pwsh
        run: .\tools\stage-windows-wheel.ps1 -Target ${{ matrix.core-target }} -Binding ${{ matrix.binding }}

      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --target ${{ matrix.target }}
            --out dist

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -c "import zipfile; z=zipfile.ZipFile(r'$($wheel.FullName)'); n=set(z.namelist()); assert any(x.endswith('/minicronet.dll') for x in n); assert any(x.endswith('/icudtl.dat') for x in n); print('Windows runtime files present')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.core-target }} / ${{ matrix.binding }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            core-target: macos-arm64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            runner: macos-15
          - target: aarch64-apple-darwin
            core-target: macos-arm64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.10"
            runner: macos-15
            maturin-version: "0.14.17"
          - target: x86_64-apple-darwin
            core-target: macos-x86_64
            binding: python
            manifest: bindings/python/Cargo.toml
            python-version: "3.10"
            runner: macos-15-intel
          - target: x86_64-apple-darwin
            core-target: macos-x86_64
            binding: python36
            manifest: bindings/python36/Cargo.toml
            python-version: "3.10"
            runner: macos-15-intel
            maturin-version: "0.14.17"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify Core artifact
        run: |
          test -f "core/binaries/${{ matrix.core-target }}/libminicronet.dylib"
          python3 - "${{ matrix.core-target }}" <<'PY'
          import hashlib, json, pathlib, sys
          target = sys.argv[1]
          root = pathlib.Path("core/binaries") / target
          manifest = json.loads((root / "manifest.json").read_text())
          path = root / manifest["library"]
          assert hashlib.sha256(path.read_bytes()).hexdigest() == manifest["sha256"]
          assert path.stat().st_size == manifest["size_bytes"]
          print("Core artifact verified:", target)
          PY

      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: ${{ matrix.maturin-version || 'latest' }}
          args: >-
            --release
            --locked
            --manifest-path ${{ matrix.manifest }}
            --target ${{ matrix.target }}
            --out dist

      - name: Bundle macOS Core dylib
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check delocate
          mkdir repaired
          DYLD_LIBRARY_PATH="$PWD/core/binaries/${{ matrix.core-target }}" \
            delocate-wheel -w repaired dist/*.whl
          rm dist/*.whl
          mv repaired/*.whl dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_pypi
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
