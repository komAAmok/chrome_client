name: Build wheels

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the built wheels to PyPI
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python-arch: x64
            target: x86_64-pc-windows-msvc
            native-dir: windows
          - arch: x86
            python-arch: x86
            target: i686-pc-windows-msvc
            native-dir: windows32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python-arch }}

      - name: Copy Cronet runtime
        shell: pwsh
        run: |
          Copy-Item "cronet-libs/${{ matrix.native-dir }}/cronet.144.0.7506.0.dll" "python/chrome_client/" -Force

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: chrome-client-windows-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Copy Cronet runtime and NSS libraries
        run: |
          cp cronet-libs/linux/libcronet.144.0.7506.0.so python/chrome_client/
          cp linux_deps/*.so python/chrome_client/

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          # Build in the manylinux2014 container, but skip its 2.17 audit tag:
          # bundled Cronet requires exactly GLIBC_2.18.
          manylinux: "off"
          container: quay.io/pypa/manylinux2014_x86_64:latest
          # The action can mount the checkout either at /io or at the original
          # runner path. Cover both so auditwheel can resolve Cronet's SONAME.
          docker-options: >-
            -e LD_LIBRARY_PATH=/io/python/chrome_client:/io/linux_deps:/io/target/x86_64-unknown-linux-gnu/release:${{ github.workspace }}/python/chrome_client:${{ github.workspace }}/linux_deps:${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release
          # Match the Python 3.10 toolchain used by the Windows and macOS jobs.
          args: >-
            --release
            --locked
            --compatibility linux
            --out dist
            --interpreter /opt/python/cp310-cp310/bin/python3.10

      - name: Apply the exact glibc compatibility tag
        run: |
          python -m pip install --disable-pip-version-check wheel==0.45.1
          python -m wheel tags --platform-tag manylinux_2_18_x86_64 --remove dist/*-linux_x86_64.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: chrome-client-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Cronet runtime for wheel repair
        run: |
          cp cronet-bin/mac/libcronet.dylib ./libcronet.144.0.7506.0.dylib
          cp cronet-bin/mac/libcronet.dylib python/chrome_client/libcronet.144.0.7506.0.dylib

      - name: Build arm64 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --locked --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: chrome-client-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_pypi
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chrome-client
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: chrome-client-*
          path: dist
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
