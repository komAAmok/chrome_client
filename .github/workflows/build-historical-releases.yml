name: Build historical releases (v0.2.7 – v0.2.15)

# 为已经存在的 tag 补建 wheel，并（可选地）发布到 GitHub Release / PyPI。
#
# 为什么需要单独一个 workflow：build-wheels.yml 只在 push tag 时触发，而这 9 个
# tag 早已推上去，不会重跑。这里按 tag 逐个 checkout，复用同一套构建方式。
#
# Core 不在这里编译：每个 tag 已经把 core/binaries/<target>/ 的产物提交进仓库，
# 构建只把 Rust 扩展链上去。这正是 build-wheels.yml 里 “Verify Core artifact”
# 那一步的前提。

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 逗号分隔的 tag 列表
        required: true
        default: v0.2.7,v0.2.8,v0.2.9,v0.2.10,v0.2.11,v0.2.12,v0.2.13,v0.2.14,v0.2.15
      upload_github_release:
        description: 把 wheel 挂到对应 tag 的 GitHub Release
        type: boolean
        required: true
        default: true
      upload_pypi:
        description: 同时发布到 PyPI（版本号不可重发，确认后再开）
        type: boolean
        required: true
        default: false

permissions:
  contents: write    # 创建/更新 Release 需要
  # 构建溯源（GitHub 页面上那个 Full provenance）。缺这一条时 Release 会显示
  # No provenance——用户实测 0.2.15 就是这个状态。attestation 绑定的是构建时的
  # workflow run，事后补不上，所以必须在重新构建之前加上。
  attestations: write
  # PyPI Trusted Publishing 必需：action 用它换取 OIDC token 向 PyPI 认证。
  # 去掉它，publish 会退回到需要 password 的路径并直接失败。
  id-token: write

concurrency:
  group: historical-releases
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MINICRONET_REQUIRE_NATIVE: "1"

jobs:
  plan:
    name: Plan the tag × platform matrix
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.plan.outputs.map }}
      matrix: ${{ steps.plan.outputs.matrix }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要读历史 tag 的树
      - id: plan
        shell: bash
        env:
          TAGS: ${{ inputs.tags }}
          PLATFORMS: '[{"core-target":"linux-x86_64","binding":"python","runner":"ubuntu-latest","manifest":"bindings/python/Cargo.toml","py":"3.9","rusttarget":"x86_64-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","os":"linux"},{"core-target":"linux-x86_64","binding":"python36","runner":"ubuntu-latest","manifest":"bindings/python36/Cargo.toml","py":"3.9","rusttarget":"x86_64-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","maturin":"0.14.17","rustflags":"--cfg=py_sys_config=\"WITH_THREAD\"","os":"linux"},{"core-target":"linux-x86","binding":"python","runner":"ubuntu-latest","manifest":"bindings/python/Cargo.toml","py":"3.9","rusttarget":"i686-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","os":"linux"},{"core-target":"linux-x86","binding":"python36","runner":"ubuntu-latest","manifest":"bindings/python36/Cargo.toml","py":"3.9","rusttarget":"i686-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","maturin":"0.14.17","rustflags":"--cfg=py_sys_config=\"WITH_THREAD\"","os":"linux"},{"core-target":"linux-arm64","binding":"python","runner":"ubuntu-24.04-arm","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"aarch64-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","os":"linux"},{"core-target":"linux-arm64","binding":"python36","runner":"ubuntu-24.04-arm","manifest":"bindings/python36/Cargo.toml","py":"3.10","rusttarget":"aarch64-unknown-linux-gnu","lib":"libminicronet.so","manylinux":"2014","maturin":"0.14.17","rustflags":"--cfg=py_sys_config=\"WITH_THREAD\"","os":"linux"},{"core-target":"windows-x86_64","binding":"python","runner":"windows-2022","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"x86_64-pc-windows-msvc","lib":"minicronet.dll","os":"windows","arch":"x64"},{"core-target":"windows-x86_64","binding":"python36","runner":"windows-2022","manifest":"bindings/python36/Cargo.toml","py":"3.6","rusttarget":"x86_64-pc-windows-msvc","lib":"minicronet.dll","maturin":"0.14.17","os":"windows","arch":"x64"},{"core-target":"windows-x86","binding":"python","runner":"windows-2022","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"i686-pc-windows-msvc","lib":"minicronet.dll","os":"windows","arch":"x86"},{"core-target":"windows-x86","binding":"python36","runner":"windows-2022","manifest":"bindings/python36/Cargo.toml","py":"3.6","rusttarget":"i686-pc-windows-msvc","lib":"minicronet.dll","maturin":"0.14.17","os":"windows","arch":"x86"},{"core-target":"windows-arm64","binding":"python","runner":"windows-2022","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"aarch64-pc-windows-msvc","lib":"minicronet.dll","os":"windows","arch":"x64"},{"core-target":"macos-arm64","binding":"python","runner":"macos-15","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"aarch64-apple-darwin","lib":"libminicronet.dylib","os":"macos"},{"core-target":"macos-arm64","binding":"python36","runner":"macos-15","manifest":"bindings/python36/Cargo.toml","py":"3.10","rusttarget":"aarch64-apple-darwin","lib":"libminicronet.dylib","maturin":"0.14.17","os":"macos"},{"core-target":"macos-x86_64","binding":"python","runner":"macos-15-intel","manifest":"bindings/python/Cargo.toml","py":"3.10","rusttarget":"x86_64-apple-darwin","lib":"libminicronet.dylib","os":"macos"},{"core-target":"macos-x86_64","binding":"python36","runner":"macos-15-intel","manifest":"bindings/python36/Cargo.toml","py":"3.10","rusttarget":"x86_64-apple-darwin","lib":"libminicronet.dylib","maturin":"0.14.17","os":"macos"}]'
        run: |
          python3 - <<"PY" >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys

          tags = [t.strip() for t in os.environ["TAGS"].split(",") if t.strip()]
          if not tags:
              raise SystemExit("no tags given")

          def ls(tag, path):
              out = subprocess.run(["git", "ls-tree", "--name-only", tag, path],
                                   capture_output=True, text=True, check=True).stdout
              return [line.strip() for line in out.splitlines() if line.strip()]

          rows = []
          for tag in tags:
              # core/binaries/ 里既有目录也有文件（README.md、targets.json）。
              # 只有目录才是平台；用 -d 判定，不要靠文件名黑名单。
              # core/binaries/ 里既有目录也有文件（README.md、targets.json）。
              # ls-tree --name-only 返回的是完整路径，所以先取 basename 再问
              # git 它是什么类型；只保留 tree（目录）。
              targets = set()
              for path in ls(tag, "core/binaries/"):
                  name = path.rstrip("/").rsplit("/", 1)[-1]
                  probe = subprocess.run(
                      ["git", "cat-file", "-t", f"{tag}:core/binaries/{name}"],
                      capture_output=True, text=True)
                  if probe.stdout.strip() == "tree":
                      targets.add(name)
              version = subprocess.run(["git", "show", f"{tag}:Cargo.toml"],
                                       capture_output=True, text=True,
                                       check=True).stdout
              version = next(l.split(chr(34))[1] for l in version.splitlines()
                             if l.startswith("version"))
              rows.append({"tag": tag, "version": version,
                           "targets": sorted(targets)})
              print(f"::notice::{tag} {version} -> {len(targets)} core targets",
                    file=sys.stderr)
          # GitHub 的 matrix 里，动态的 tag 列表与静态的 include 列表不会自动做笛卡尔
          # 积：tag: fromJSON(...) 配 include: 只会取第一个 tag 的首个 include 项。
          # 实测：第一版 workflow 只跑了一个组合（macos-x86_64/python36），Release
          # 上也只挂了一个 wheel。所以矩阵在这里就展开成 tag × 平台，交给 build 直接
          # 消费，不再让 matrix 自己组合。
          PLATFORMS = json.loads(os.environ["PLATFORMS"])
          matrix = []
          for row in rows:
              have = set(row["targets"])
              for p in PLATFORMS:
                  if p["core-target"] in have:
                      pytag = p["py"].replace(".", "")
                      # v0.2.10 与 v0.2.12 发布时漏了更新 bindings/python36/Cargo.lock：
                      # lock 里 chrome-client-python36 的版本仍是上一个 release 的，
                      # 于是 `cargo metadata --locked` 直接失败。实测：
                      #   v0.2.10 Cargo.toml 0.2.10 / lock 0.2.9
                      #   v0.2.12 Cargo.toml 0.2.12 / lock 0.2.11
                      # Linux 侧侥幸通过，因为 manylinux 容器里的 cargo 较旧、不校验；
                      # Windows 与 macOS 的新 cargo 会拒绝，形成 4 平台 × 2 tag = 8 个红。
                      # --locked 是仓库的可复现性要求，不能为了迁就坏 tag 关掉；
                      # 做法是把这类组合显式排除并记录，而不是静默改用非 locked 构建。
                      # 只有宿主 cargo 会拒绝；manylinux 容器里的 cargo 较旧、不校验，
                      # 所以 Linux 的 python36 实测是通过的，必须保留——排除全部
                      # python36 会把 3 个本来能过的组合也砍掉。
                      lock_broken = (p["binding"] == "python36"
                                     and p["os"] in ("windows", "macos")
                                     and row["tag"] in ("v0.2.10", "v0.2.12"))
                      if lock_broken:
                          print(f"::warning::{row['tag']} {p['binding']} skipped: "
                                f"Cargo.lock is stale (see workflow comment)",
                                file=sys.stderr)
                          continue
                      matrix.append({**p, "tag": row["tag"], "version": row["version"],
                                     "pytag": pytag})
          print(f"::notice::matrix is {len(matrix)} jobs", file=sys.stderr)
          print("tags=" + json.dumps([r["tag"] for r in rows]))
          print("map=" + json.dumps(rows))
          print("matrix=" + json.dumps({"include": matrix}))
          PY

  # 每个 tag 一个 build 作业，内部再用静态矩阵展开成 12 个 wheel。
  # 用静态矩阵而不是动态 matrix，是因为 GitHub 的 matrix 不能按 tag 变化；
  # 做不到的条件（0.2.7 没有 linux-armv7 产物）在步骤里用 test -f 显式跳过并记 note。
  build:
    name: ${{ matrix.tag }} / ${{ matrix.core-target }} / ${{ matrix.binding }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 注意：/opt/python/cp39-* 只存在于 manylinux 容器内（maturin-action 自己会进
    # 容器，用的是 --manylinux 参数）。宿主机上的步骤一律用 runner 自带的 python3，
    # 因为宿主路径里没有 cp39。第一版把 PY 全局设成容器路径，导致 Core 校验在宿主
    # 上 exit 127。
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          lfs: true
      # 历史 tag 里没有本次新增的校验工具（它们只存在于 main）。
      # 从 workflow 所在的提交把它们取下来，而不是要求每个 tag 都有。
      - name: Fetch release tooling from the workflow commit
        shell: bash
        run: |
          git fetch --depth=1 origin "${{ github.sha }}" 2>/dev/null || true
          for f in tools/verify-release-wheel.py; do
            if [[ ! -f "$f" ]]; then
              git show "${{ github.sha }}:$f" > "$f"
              chmod +x "$f"
              echo "restored $f from ${{ github.sha }}"
            fi
          done

      # 0.2.7 / 0.2.8 只带 8 个平台产物，没有 linux-armv7；用 test 显式判断而不是
      # 让 checkout 失败，这样该组合记 skipped 而不是把整个 tag 判红。
      - name: Skip when this tag has no artifact for the target
        id: gate
        shell: bash
        run: |
          if [[ -f "core/binaries/${{ matrix.core-target }}/${{ matrix.lib }}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.tag }} has no ${{ matrix.core-target }} artifact; skipping"
          fi

      - name: Verify Core artifact matches its manifest
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          python3 - "${{ matrix.core-target }}" <<"PY"
          import hashlib, json, pathlib, sys
          target = sys.argv[1]
          root = pathlib.Path("core/binaries") / target
          manifest = json.loads((root / "manifest.json").read_text())
          path = root / manifest["library"]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != manifest["sha256"]:
              raise SystemExit(f"{target}: sha256 mismatch vs manifest")
          if path.stat().st_size != manifest["size_bytes"]:
              raise SystemExit(f"{target}: size mismatch vs manifest")
          print(f"core ok: {target} {manifest.get('chromium_revision', '')[:12]}")
          PY

      # setup-python 在 ubuntu-latest 上装不到 3.9：runner 已经是 Ubuntu 26.04，
      # 该版本的 Python 清单里没有 3.9（实测报 "version 3.9 ... was not found
      # for Ubuntu 26.04"）。build-wheels.yml 的做法是用 manylinux 容器自带的
      # /opt/python/cp39，本文件沿用：Linux 上不跑 setup-python，其他平台照旧。
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.present == 'true' && !startsWith(matrix.runner, 'ubuntu')
        with:
          python-version: ${{ matrix.py }}
          architecture: ${{ matrix.arch }}

      # i686 / arm64 的 manylinux 容器要靠 binfmt 才能在这个 runner 上跑起来。
      # build-wheels.yml 有这一步，本文件第一版漏了：linux-x86 直接死在
      # manylinux2014_i686 里，yum 连 CentOS-7 仓库失败（CentOS 7 已 EOL），
      # 而同一台 runner 上跑现有 CI 却成功——差别就是这两个 binfmt 命令。
      - name: Set up QEMU for cross-architecture containers
        if: steps.gate.outputs.present == 'true' && startsWith(matrix.runner, 'ubuntu')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,386

      - name: Install Rust target
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: rustup target add ${{ matrix.rusttarget }}

      - name: Stage Windows runtime next to the extension
        if: steps.gate.outputs.present == 'true' && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: .\tools\stage-windows-wheel.ps1 -Target ${{ matrix.core-target }} -Binding ${{ matrix.binding }}

      - name: Build wheel
        if: steps.gate.outputs.present == 'true'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.rusttarget }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: ${{ matrix.maturin || 'latest' }}
          args: >-
            --release --locked
            --manifest-path ${{ matrix.manifest }}
            --target ${{ matrix.rusttarget }}
            --out dist
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib
          AUDITWHEEL_LD_LIBRARY_PATH: ${{ github.workspace }}/core/binaries/${{ matrix.core-target }}:/io/core/binaries/${{ matrix.core-target }}:/usr/lib64:/lib64:/usr/lib:/lib

      # macOS 的 wheel 默认不带 Core：maturin 只打包 Rust 扩展，dylib 要靠
      # delocate 从 DYLD_LIBRARY_PATH 里找出来放进 .libs/。build-wheels.yml
      # 有这一步，本文件第一版漏了，校验脚本因此在 macos-x86_64 上拦截成功。
      - name: Bundle the macOS Core dylib
        if: steps.gate.outputs.present == 'true' && startsWith(matrix.runner, 'macos')
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check delocate
          mkdir -p repaired
          DYLD_LIBRARY_PATH="$PWD/core/binaries/${{ matrix.core-target }}" \
            delocate-wheel -w repaired dist/*.whl
          rm -f dist/*.whl
          mv repaired/*.whl dist/
          # Core 是按 mac_deployment_target 13.0 编的，delocate 只改 install name，
          # 不改 wheel 的 platform tag。历史 tag 里不一定有这个脚本，缺就跳过。
          if [[ -f tools/macos-wheel-floor.py ]]; then
            python3 tools/macos-wheel-floor.py dist/*.whl
          else
            git show "${{ github.sha }}:tools/macos-wheel-floor.py" > tools/macos-wheel-floor.py
            python3 tools/macos-wheel-floor.py dist/*.whl
          fi

      # 构建成功 ≠ 能用。wheel 里必须真的有对应版本的 Core，且版本串与 tag 一致。
      - name: Verify the wheel embeds the matching Core
        if: steps.gate.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/verify-release-wheel.py \
            --dist dist \
            --tag "${{ matrix.tag }}" \
            --version "${{ matrix.tag }}" \
            --core-target "${{ matrix.core-target }}"

      # 为这一个 wheel 生成 Sigstore 构建溯源，作为 Release 附件一起发布。
      # subject-path 只指向本作业产出的文件，所以每个平台的证明只覆盖它自己。
      - name: Attest wheel build provenance
        if: steps.gate.outputs.present == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.present == 'true'
        with:
          name: wheel-${{ matrix.tag }}-${{ matrix.core-target }}-${{ matrix.binding }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub Releases
    needs: [plan, build]
    if: inputs.upload_github_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ matrix.tag }}-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          files: dist/*.whl
          fail_on_unmatched_files: true
          # 已存在的 Release 追加附件而不是覆盖说明
          append_body: true

  pypi:
    name: Publish to PyPI
    needs: [plan, build]
    if: inputs.upload_pypi
    runs-on: ubuntu-latest
    # environment 只是一个闸门：在仓库 Settings -> Environments 里给它加必需审批，
    # 就能让每次上 PyPI 都过一个人工确认。它不提供任何凭据。
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # 版本号不可重发：先检查这些版本在 PyPI 上是否已存在，存在就停。
      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          python3 - <<"PY"
          import json, urllib.request, sys, pathlib, re
          versions = set()
          for whl in pathlib.Path("dist").glob("*.whl"):
              m = re.match(r"chrome_client-([0-9.]+)-", whl.name)
              if m:
                  versions.add(m.group(1))
          print("versions in dist:", sorted(versions))
          try:
              data = json.load(urllib.request.urlopen(
                  "https://pypi.org/pypi/chrome_client/json", timeout=30))
              existing = set(data.get("releases", {}))
          except Exception as exc:
              print("could not read PyPI index:", exc)
              sys.exit(1)
          clash = sorted(versions & existing)
          if clash:
              print(f"::error::versions already on PyPI: {clash}")
              sys.exit(1)
          print("no clash; safe to upload")
          PY
      # 用 Trusted Publishing（OIDC），不用 API token。两者的差别不只是认证：
      # 只有 OIDC 上传才会让 PyPI 生成 PEP 740 attestation。用 token 上传的文件
      # 在文件页上永远没有 provenance，这是机制决定的，事后补不了。
      #
      # PyPI 侧已注册的 publisher（用户实测确认）：
      #   Owner dafatyu / Repository chrome_client
      #   Workflow build-historical-releases.yml / Environment pypi
      # 三处必须与下面 environment: 和本文件名逐字一致，改名即失效。
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
