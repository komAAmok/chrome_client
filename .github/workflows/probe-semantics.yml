name: Probe matrix needs semantics
on:
  workflow_dispatch:
    inputs:
      flag:
        type: boolean
        default: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.p.outputs.tags }}
    steps:
      - id: p
        run: echo "tags=[\"t1\"]" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ matrix.n }}" = "2" ]; then exit 1; fi
          echo ok
  rel_old_style:
    needs: [plan, build]
    if: always() && inputs.flag && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - run: echo "old-style release for ${{ matrix.tag }}"
  rel_new_style:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (inputs.flag == true || inputs.flag == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - run: echo "new-style release for ${{ matrix.tag }}"